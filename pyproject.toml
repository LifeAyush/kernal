[project]
name = "kernal"
version = "0.1.0"
description = "Personal workbench workspace root"
requires-python = ">=3.12"
dependencies = [
    "kernal-api",
    "kernal-cli",
    "kernal-core",
    "kernal-linkedin",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["core", "apps/api", "apps/linkedin", "cli"]

[tool.uv.sources]
kernal-api = { workspace = true }
kernal-cli = { workspace = true }
kernal-core = { workspace = true }
kernal-linkedin = { workspace = true }

[tool.ruff]
target-version = "py312"
src = ["core/src", "apps/api/src", "apps/linkedin/src", "cli/src"]
